name: NDE spec boilerplate
description: Puts the NDE logo, house style and shared Liquid partials (nde-*.liquid) next to a Bikeshed spec and renders its Liquid templates.

inputs:
  working-directory:
    description: Directory that holds the spec
    default: '.'

runs:
  using: composite
  steps:
    # nde.mk installs docgen itself, and only when the spec has templates.
    - name: Copy the boilerplate and render templates
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: make -f "$GITHUB_ACTION_PATH/nde.mk" ci
