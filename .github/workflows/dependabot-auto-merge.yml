name: Auto-merge Dependabot PRs

on:
  pull_request:
  workflow_call:
    inputs:
      merge-immediately:
        description: 'Merge right away instead of when the required checks pass; for a caller that runs this job after its own checks'
        type: boolean
        default: false
    secrets:
      GH_APP_ID:
        required: true
      GH_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      # --auto waits for the required checks, and needs auto-merge enabled on the repository.
      - name: Merge PR
        run: |
          if [ "$MERGE_IMMEDIATELY" = true ]; then
            gh pr merge --squash "$PR_URL"
          else
            gh pr merge --auto --squash "$PR_URL"
          fi
        env:
          MERGE_IMMEDIATELY: ${{ inputs.merge-immediately }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
