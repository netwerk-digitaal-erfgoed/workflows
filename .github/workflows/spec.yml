name: Build and publish a specification document

on:
  workflow_call:
    inputs:
      publish:
        description: 'Whether to publish the result'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Render .liquid template files
        if: ${{ hashFiles('**/*.liquid') != '' }}
        run: |
          set -e
          frame_opt=""
          [[ -f shacl.frame.jsonld ]] && frame_opt="-f shacl.frame.jsonld"
          for template_file in $(find . -name '*.liquid' -type f); do
            output_file="${template_file%.liquid}"
            npx --yes @lde/docgen@latest from-shacl $frame_opt shacl.ttl "$template_file" > "$output_file"
          done

      - name: Render Mermaid diagrams
        if: ${{ hashFiles('**/*.mmd') != '' }}
        run: |
          set -e
          # mermaid-cli's bundled puppeteer pins a Chrome build that is not published to
          # the Chrome-for-Testing catalog, so neither its auto-download nor an explicit
          # `puppeteer browsers install` can fetch it. Point puppeteer at the Chrome that
          # is already preinstalled on the runner instead.
          chrome_path=""
          for candidate in google-chrome google-chrome-stable chromium-browser chromium; do
            if command -v "$candidate" >/dev/null 2>&1; then
              chrome_path="$(command -v "$candidate")"
              break
            fi
          done
          if [[ -n "$chrome_path" ]]; then
            printf '{"args":["--no-sandbox"],"executablePath":"%s"}\n' "$chrome_path" > puppeteer-config.json
          else
            echo '{"args":["--no-sandbox"]}' > puppeteer-config.json
          fi
          for mermaid_file in $(find . -name '*.mmd' -type f); do
            output_file="${mermaid_file%.mmd}.svg"
            npx --yes -p @mermaid-js/mermaid-cli mmdc -i "$mermaid_file" -o "$output_file" --backgroundColor transparent --theme neutral -p puppeteer-config.json
          done

      - name: Build and validate
        uses: w3c/spec-prod@v2
        with:
          VALIDATE_MARKUP: false

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ inputs.publish }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: spec-prod-result

      # Publish repo-level static files (e.g. a hosted JSON-LD context) alongside the
      # built spec. Opt-in: only repos with a public/ directory are affected; its
      # contents are copied to the published site root.
      - uses: actions/checkout@v7
        with:
          path: _source
      - name: Copy public/ static files to the site root
        run: |
          if [ -d _source/public ]; then
            cp -R _source/public/. .
          fi
          rm -rf _source

      - uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
