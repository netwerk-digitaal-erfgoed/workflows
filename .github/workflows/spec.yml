name: Build and publish a specification document

on:
  workflow_call:
    inputs:
      publish:
        description: 'Whether to publish the result'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # The logo, house style and template rendering come from this repository at
      # the commit the spec calls this workflow with (`spec.yml@<tag>`), so a spec
      # that pins a version gets the matching boilerplate.
      - name: Check out the spec boilerplate
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .nde-workflows

      - name: Copy the boilerplate and render templates
        uses: ./.nde-workflows/spec-boilerplate

      # The whole working directory is published, so keep the checkout out of it.
      - name: Remove the boilerplate checkout
        run: rm -rf .nde-workflows

      - name: Render Mermaid diagrams
        if: ${{ hashFiles('**/*.mmd') != '' }}
        run: |
          set -e
          # mermaid-cli's bundled puppeteer pins a Chrome build that is not published to
          # the Chrome-for-Testing catalog, so neither its auto-download nor an explicit
          # `puppeteer browsers install` can fetch it. Point puppeteer at the Chrome that
          # is already preinstalled on the runner instead.
          chrome_path=""
          for candidate in google-chrome google-chrome-stable chromium-browser chromium; do
            if command -v "$candidate" >/dev/null 2>&1; then
              chrome_path="$(command -v "$candidate")"
              break
            fi
          done
          if [[ -n "$chrome_path" ]]; then
            printf '{"args":["--no-sandbox"],"executablePath":"%s"}\n' "$chrome_path" > puppeteer-config.json
          else
            echo '{"args":["--no-sandbox"]}' > puppeteer-config.json
          fi
          for mermaid_file in $(find . -name '*.mmd' -type f); do
            output_file="${mermaid_file%.mmd}.svg"
            npx --yes -p @mermaid-js/mermaid-cli mmdc -i "$mermaid_file" -o "$output_file" --backgroundColor transparent --theme neutral -p puppeteer-config.json
          done

      - name: Build and validate
        uses: w3c/spec-prod@v2.14.1
        with:
          VALIDATE_MARKUP: false

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ inputs.publish }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: spec-prod-result

      # Bikeshed includes these at build time; they are not part of the site.
      - name: Remove the boilerplate includes
        run: rm -f logo.include nde.include

      # Publish repo-level static files (e.g. a hosted JSON-LD context) alongside the
      # built spec. Opt-in: only repos with a public/ directory are affected; its
      # contents are copied to the published site root.
      - uses: actions/checkout@v7
        with:
          path: _source
      - name: Copy public/ static files to the site root
        run: |
          if [ -d _source/public ]; then
            cp -R _source/public/. .
          fi
          rm -rf _source

      - uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
